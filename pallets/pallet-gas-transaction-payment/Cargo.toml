[package]
name = "pallet-gas-transaction-payment"
description = "Runtime transaction extension for prepaid gas credits."
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
frame = { workspace = true, features = ["experimental", "runtime"], default-features = false }
pallet-transaction-payment = { workspace = true }
scale-info = { features = ["derive"], workspace = true }

[dev-dependencies]
polkadot-sdk = { workspace = true, default-features = true, features = [
	"pallet-balances",
	"pallet-transaction-payment",
] }

[features]
default = ["std"]
runtime-benchmarks = ["frame/runtime-benchmarks"]
std = ["codec/std", "frame/std", "pallet-transaction-payment/std", "scale-info/std"]
try-runtime = ["frame/try-runtime", "pallet-transaction-payment/try-runtime"]
