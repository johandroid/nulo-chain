[package]
name = "nulo-node"
description = "A parachain node template built with Substrate and Cumulus, part of Polkadot Sdk."
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[dependencies]
clap = { features = ["derive"], workspace = true }
codec = { workspace = true, default-features = true }
color-print = { workspace = true }
docify = { workspace = true }
futures = { workspace = true }
ismp-parachain-inherent = { workspace = true }
ismp-parachain-runtime-api = { workspace = true }
jsonrpsee = { features = ["server"], workspace = true }
log = { workspace = true, default-features = true }
nulo-chain.workspace = true
pallet-ismp-rpc = { workspace = true }
pallet-ismp-runtime-api = { workspace = true }
polkadot-sdk = { workspace = true, features = ["node", "polkadot-primitives"] }
prometheus-endpoint.default-features = true
prometheus-endpoint.workspace = true
serde = { features = ["derive"], workspace = true, default-features = true }

[build-dependencies]
polkadot-sdk = { workspace = true, features = ["substrate-build-script-utils"] }

[features]
default = ["std"]
std = ["log/std", "nulo-chain/std", "polkadot-sdk/std"]
runtime-benchmarks = [
	"nulo-chain/runtime-benchmarks",
	"polkadot-sdk/runtime-benchmarks",
]
try-runtime = [
	"nulo-chain/try-runtime",
	"polkadot-sdk/try-runtime",
]
